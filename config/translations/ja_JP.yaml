dialog_chassis_motion_safety_message: |
  前進、後退、左移動、右移動、左回転、右回転の各ボタンは切り替え式です。
  押すと、現在の速度で指定方向へ直ちに移動します。
  同じボタンをもう一度押すと、動作を停止して解除できます。
dialog_chassis_motion_safety_informative: 周囲に十分な空間があり、人が近くにおらず、進行方向に障害物がないことを確認し、緊急停止手段をいつでも使える状態で操作してください。
