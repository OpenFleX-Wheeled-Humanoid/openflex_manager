dialog_chassis_motor_safety_message: При тестировании отдельных моторов убедитесь, что шасси приподнято над полом, чтобы избежать неожиданного движения колёс и травм. Также избегайте перегрузки моторов, чтобы предотвратить их повреждение.
dialog_chassis_motion_safety_title: Предупреждение по управлению шасси
dialog_chassis_motion_safety_message: |
  Кнопки Вперёд, Назад, Влево, Вправо, Поворот влево и Поворот вправо работают как переключатели.
  После нажатия шасси начинает двигаться в выбранном направлении на текущей скорости.
  Чтобы отменить движение и остановить его, нажмите ту же кнопку ещё раз.
dialog_chassis_motion_safety_informative: Управляйте только тогда, когда вокруг достаточно места, рядом нет людей, на пути нет препятствий и кнопка аварийной остановки готова к использованию.
